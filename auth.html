<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070f19">
  <title>Create your account — rippr</title>
  <meta name="description" content="Join rippr. One pack. One card. Something unexpected.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="auth.css">
  <script src="auth.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#auth-panel">Skip to account form</a>
  <header class="auth-header">
    <a class="brand" href="index.html" aria-label="rippr home">rippr<svg viewBox="0 0 24 28" aria-hidden="true"><path d="M12 0C13 9 15 12 24 14C15 16 13 19 12 28C11 19 9 16 0 14C9 12 11 9 12 0Z"/></svg></a>
    <a class="back-link" href="index.html#packs"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m10 3-5 5 5 5"/></svg>Back to packs</a>
  </header>
  <main class="auth-layout">
    <section class="auth-visual" aria-labelledby="visual-title">
      <div class="visual-heading"><h2 id="visual-title">Your next great pull.</h2><p>One pack. One card. Something unexpected.</p></div>
      <img class="showcase-art" src="assets/auth-showcase.svg" alt="Plus, Premium, and Ultimate rippr Pokémon packs" width="748" height="576">
    </section>
    <section class="auth-form-panel">
      <div class="auth-tabs" role="tablist" aria-label="Account access">
        <button id="signup-tab" type="button" role="tab" aria-selected="true" aria-controls="auth-panel">Sign up</button>
        <button id="login-tab" type="button" role="tab" aria-selected="false" aria-controls="auth-panel" tabindex="-1">Log in</button>
      </div>
      <div id="auth-panel" role="tabpanel" aria-labelledby="signup-tab" tabindex="-1">
        <h1 id="auth-title">Create your account</h1>
        <p id="auth-intro" class="auth-intro">A little closer to your next discovery.</p>
        <form id="auth-form" novalidate method="post">
          <div class="field-group">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="you@example.com" required aria-describedby="email-error">
            <p id="email-error" class="field-error" hidden></p>
          </div>
          <div class="field-group password-group">
            <label for="password">Password</label>
            <div class="password-input"><input id="password" name="password" type="password" autocomplete="new-password" placeholder="Create a password" minlength="12" required aria-describedby="password-help password-error"><button id="password-toggle" type="button" aria-label="Show password" aria-controls="password" aria-pressed="false"><svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.7-7 10-7 10 7 10 7-3.7 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M9 5.5A12 12 0 0 1 12 5c6.3 0 10 7 10 7a20 20 0 0 1-4 4.5M6 6.5A20 20 0 0 0 2 12s3.7 7 10 7c1 0 2-.2 3-.6"/></svg></button></div>
            <p id="password-help" class="password-help">At least 12 characters</p>
            <p id="password-error" class="field-error" hidden></p>
          </div>
          <div id="terms-group" class="terms-group"><div class="terms-row"><input id="terms" type="checkbox" required aria-labelledby="terms-label" aria-describedby="terms-error"><span id="terms-label">I agree to the <button type="button" class="text-link" data-policy="terms">Terms</button> and <button type="button" class="text-link" data-policy="privacy">Privacy Policy</button></span></div><p id="terms-error" class="field-error" hidden></p></div>
          <button id="auth-submit" class="submit-button" type="submit" disabled>Create account</button>
          <p id="auth-status" class="auth-status" role="status" tabindex="-1" hidden></p>
          <noscript><p class="auth-status">Enable JavaScript to preview this form. Account services are not connected.</p></noscript>
        </form>
        <p class="switch-mode"><span id="switch-intro">Already have an account?</span> <button id="switch-mode" class="text-link" type="button">Log in</button></p>
      </div>
    </section>
  </main>
  <footer class="auth-footer">Collect the unexpected.</footer>
  <dialog id="policy-dialog" aria-labelledby="policy-title"><button id="policy-close" type="button" aria-label="Close dialog">×</button><h2 id="policy-title"></h2><p id="policy-copy"></p></dialog>
</body>
</html>
