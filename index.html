<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080e17">
  <meta name="description" content="One pack. One card. Something unexpected. Explore rippr's original collectible packs and try a free demo opening.">
  <title>rippr — Your next great pull.</title>
  <link rel="stylesheet" href="style.css">
  <script src="packs.js" defer></script>
  <script src="app.js" defer></script>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml"></head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="rippr home">rippr<svg viewBox="0 0 24 28" aria-hidden="true"><path d="M12 0C13 9 15 12 24 14C15 16 13 19 12 28C11 19 9 16 0 14C9 12 11 9 12 0Z"/></svg></a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="#packs" class="active" aria-current="page">Packs</a>
        <button type="button" data-dialog="collection">Collection</button>
        <button type="button" data-dialog="how">How it works</button>
      </nav>
      <div class="account-actions">
        <button class="login-button" type="button" data-dialog="login">Log in</button>
        <a class="primary-button get-started" href="#packs">Get started</a>
      </div>
    </div>
  </header>

  <main id="main" class="page-shell">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <h1 id="hero-title">Your next great pull.</h1>
        <p>One pack. One card. Something unexpected.</p>
        <a class="primary-button" href="#packs">Explore packs</a>
      </div>
      <div class="hero-art" aria-hidden="true">
        <div class="hero-plane plane-one"></div><div class="hero-plane plane-two"></div>
        <img class="hero-pack hero-pack-left" src="assets/pack-plus.svg" alt="" width="141" height="242">
        <img class="hero-pack hero-pack-right" src="assets/pack-ultimate.svg" alt="" width="141" height="242">
        <img class="hero-pack hero-pack-center" src="assets/pack-premium.svg" alt="" width="141" height="242">
      </div>
    </section>

    <section id="packs" class="catalog" aria-labelledby="packs-title">
      <div class="catalog-toolbar"><h2 id="packs-title">Find your level.</h2><div class="carousel-controls"><button id="previous-pack" type="button" aria-label="Previous pack">←</button><button id="next-pack" type="button" aria-label="Next pack">→</button><button id="rotation-toggle" type="button" aria-label="Pause rotation">Pause</button></div></div>
      <div id="pack-carousel" class="pack-carousel" role="region" aria-roledescription="carousel" aria-label="Five pack tiers">
        <div id="pack-grid" class="carousel-stage"></div>
        <div id="tier-selectors" class="tier-selectors" role="group" aria-label="Choose pack tier"></div>
        <p id="catalog-status" class="sr-only" role="status" aria-live="off"></p>
      </div>
      <noscript><p><a href="opening.html?pack=basic">Open a Basic demo pack</a></p></noscript>
    </section>

    <section class="grails" aria-labelledby="grails-title">
      <div class="grails-heading"><h2 id="grails-title">Grails worth<br> discovering</h2><span aria-hidden="true"></span></div>
      <div class="grail-grid">
        <button type="button" class="grail-preview" data-grail="first-light" aria-label="Preview First Light"><img src="assets/grail-first-light.svg" alt="First Light: a golden sunrise over lavender mountains" width="204" height="206"></button>
        <button type="button" class="grail-preview" data-grail="ocean-spirit" aria-label="Preview Ocean Spirit"><img src="assets/grail-ocean-spirit.svg" alt="Ocean Spirit: luminous turquoise waves under the stars" width="204" height="206"></button>
        <button type="button" class="grail-preview" data-grail="moonstone" aria-label="Preview Moonstone"><img src="assets/grail-moonstone.svg" alt="Moonstone: a lavender moon among clouds and orbiting stars" width="204" height="206"></button>
      </div>
    </section>
  </main>
  <footer class="site-footer"><div class="footer-inner"><a class="brand" href="index.html" aria-label="rippr home">rippr<svg viewBox="0 0 24 28" aria-hidden="true"><path d="M12 0C13 9 15 12 24 14C15 16 13 19 12 28C11 19 9 16 0 14C9 12 11 9 12 0Z"/></svg></a><span class="footer-divider" aria-hidden="true"></span><p>Collect the unexpected.</p></div></footer>

  <dialog id="modal" aria-labelledby="modal-title">
    <button type="button" class="modal-close" aria-label="Close dialog">×</button>
    <div id="modal-content"></div>
  </dialog>
</body>
</html>
